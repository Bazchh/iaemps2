[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iaemps2"
version = "0.1.0"
description = "Mestre invisível por inteligência artificial para jogos de PlayStation 2 em emulador."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "pillow>=11.2,<12",
  "mss>=10.2,<11",
  "pywin32>=312; sys_platform == 'win32'",
  "psutil>=7.2,<8",
  "google-genai>=1.20,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
mestre = "iaemps2.cli:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iaemps2 = ["py.typed", "**/*.sql", "**/*.json", "**/*.toml"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs/fonte"]  # geradores dos documentos, fora do produto

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # acentos não são ambiguidade; o formatador cuida da largura

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["iaemps2"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mss", "mss.*", "win32gui", "win32ui", "win32con", "win32process", "psutil", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "emulador: teste que precisa do emulador real (pulado no CI)",
  "servico: teste que precisa do serviço de linguagem real (pulado no CI)",
]
